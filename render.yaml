services:
  - type: keyvalue
    name: finpilot-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: finpilot-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerCommand: sh scripts/start_api_and_worker.sh
    healthCheckPath: /health
    disk:
      name: finpilot-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: finpilot-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads

databases:
  - name: finpilot-postgres
    databaseName: finpilot
    user: finpilot
    postgresMajorVersion: "16"
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: []
